<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สินค้าทั้งหมด | Noir Muse</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Filter Bar Styles */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      padding: 0.5rem 1.5rem;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background-color: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Noir Muse</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้าทั้งหมด</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="page-header">
      <h1>Our Eye Palettes</h1>
      <p>พาเลททาตา 12 เฉดสี รังสรรค์ความโดดเด่นในแบบคุณ</p>
    </div>

    <!-- Filter Bar (script.js จะใช้ควบคุม) -->
    <div id="filter-bar" class="filter-bar">
      <button class="filter-btn active" data-style="all">ทั้งหมด</button>
      <button class="filter-btn" data-style="gothic">Gothic</button>
      <button class="filter-btn" data-style="lolita">Lolita</button>
      <button class="filter-btn" data-style="gal">Gal</button>
    </div>

    <!-- Product List (script.js จะ render ข้อมูลใส่ที่นี่) -->
    <div id="product-list" class="product-grid"></div>
  </main>

  <footer>
    <p>&copy; Noir Muse. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
