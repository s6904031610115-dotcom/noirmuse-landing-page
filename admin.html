<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคำสั่งซื้อ | Noir Muse Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .admin-header h1 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .table-wrapper {
      overflow-x: auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th, td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f7f2e8;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: var(--text-primary);
      white-space: nowrap;
    }

    tr:hover {
      background-color: #faf7f0;
    }

    td {
      color: var(--text-primary);
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Noir Muse Admin</a>
      <ul class="nav-links">
        <li><a href="index.html">หน้าแรกเว็บไซต์</a></li>
        <li><a href="product.html">หน้าร้านค้า</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="admin-header">
      <h1>รายการคำสั่งซื้อ Noir Muse</h1>
    </div>

    <div class="table-wrapper">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>วันเวลา</th>
            <th>ชื่อลูกค้า</th>
            <th>เบอร์โทร/Line</th>
            <th>สไตล์ที่เลือก</th>
            <th>จำนวนเงินรวม</th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>
          <!-- script.js จะดึงข้อมูล CSV มาแสดงเรียงรายการล่าสุดขึ้นก่อน -->
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>&copy; Noir Muse Admin System. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
